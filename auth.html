<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Modern School</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Modern School</div>
        <div class="nav-toggle">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#programs">Programs</a></li>
            <li><a href="index.html#campus">Campus Life</a></li>
            <li><a href="index.html#alumni">Alumni</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="auth.html" class="active">Login</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <input type="email" id="login-email" required>
                    <label for="login-email">Email Address</label>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" required>
                    <label for="login-password">Password</label>
                    <i class="fas fa-eye-slash password-toggle"></i>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="auth-button">Login</button>
                <div class="social-auth">
                    <p>Or login with</p>
                    <div class="social-buttons">
                        <button type="button" class="social-button google">
                            <i class="fab fa-google"></i>
                        </button>
                        <button type="button" class="social-button facebook">
                            <i class="fab fa-facebook-f"></i>
                        </button>
                        <button type="button" class="social-button apple">
                            <i class="fab fa-apple"></i>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <input type="text" id="register-name" required>
                    <label for="register-name">Full Name</label>
                </div>
                <div class="form-group">
                    <input type="email" id="register-email" required>
                    <label for="register-email">Email Address</label>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password" required>
                    <label for="register-password">Password</label>
                    <i class="fas fa-eye-slash password-toggle"></i>
                </div>
                <div class="form-group">
                    <input type="password" id="register-confirm-password" required>
                    <label for="register-confirm-password">Confirm Password</label>
                    <i class="fas fa-eye-slash password-toggle"></i>
                </div>
                <div class="form-options">
                    <label class="terms-conditions">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="#">Terms & Conditions</a></span>
                    </label>
                </div>
                <button type="submit" class="auth-button">Register</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
